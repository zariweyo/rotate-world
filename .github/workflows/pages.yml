name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject build info
        shell: bash
        run: |
          build_updated_at="$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M:%S %Z')"
          cache_bust="$(TZ=Europe/Madrid date '+%Y%m%d%H%M%S')"
          short_sha="${GITHUB_SHA::7}"

          sed -i "s/updatedAt: '.*'/updatedAt: '${build_updated_at}'/g" build-info.js
          sed -i "s/cacheBust: '.*'/cacheBust: '${cache_bust}'/g" build-info.js
          sed -i "s/commit: '.*'/commit: '${short_sha}'/g" build-info.js
          sed -i "s/<span id=\"buildCommit\">.*<\/span>/<span id=\"buildCommit\">${build_updated_at} · ${short_sha}<\/span>/g" index.html
          sed -i "s/v=[0-9]\{14\}/v=${cache_bust}/g" index.html
          sed -i "s/rw=[0-9]\{14\}/rw=${cache_bust}/g" index.html
          sed -i "s/rotate-world-v[0-9]-[0-9]\{14\}/rotate-world-v3-${cache_bust}/g" sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
