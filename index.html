<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rotate World" />
  <title>Rotate World</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=20260830-gears-4" />
</head>
<body>
  <main class="app-shell">
    <section class="game-card" aria-label="Rotate World prototype">
      <header class="hud">
        <div>
          <p class="eyebrow">ROTATE WORLD · <span id="levelLabel">ROOM A</span> · <span id="buildCommit">2026-08-27 13:26:44 CEST</span></p>
          <h1>Find the way</h1>
        </div>
        <div class="hud-actions">
          <button id="refreshBtn" class="icon-btn" type="button" aria-label="Refresh app" title="Refresh app">↻</button>
          <button id="resetBtn" class="reset-btn" type="button">Reset</button>
        </div>
      </header>

      <div id="game" class="game" aria-label="Game area. Rotate the lower gear with one finger.">
        <div id="gearTrain" class="gear-train">
          <div id="worldGear" class="gear world-gear" aria-label="Circular puzzle world">
            <svg class="gear-body" viewBox="0 0 600 600" aria-hidden="true">
              <path id="worldGearShape" class="gear-shape"></path>
              <circle class="gear-rim" cx="300" cy="300" r="262"></circle>
            </svg>

            <div id="worldStack" class="world-stack">
              <svg id="levelSvg" class="level" viewBox="0 0 600 600" role="img" aria-label="Connected puzzle rooms">
            <defs>
              <linearGradient id="bgA" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#14213d"/><stop offset="100%" stop-color="#172033"/></linearGradient>
              <linearGradient id="bgB" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#18352f"/><stop offset="100%" stop-color="#11231f"/></linearGradient>
              <linearGradient id="platformGradient" gradientUnits="userSpaceOnUse" x1="0" x2="600"><stop offset="0%" stop-color="#9fd3c7"/><stop offset="100%" stop-color="#65b9ad"/></linearGradient>
              <linearGradient id="platformWarm" gradientUnits="userSpaceOnUse" x1="0" x2="600"><stop offset="0%" stop-color="#f4c27a"/><stop offset="100%" stop-color="#df8f55"/></linearGradient>
              <radialGradient id="portalCore" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f7fbff"/><stop offset="38%" stop-color="#69e8d7"/><stop offset="72%" stop-color="#6a63ff"/><stop offset="100%" stop-color="#11091f"/></radialGradient>
              <linearGradient id="portalRing" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f9d66b"/><stop offset="42%" stop-color="#70d6c8"/><stop offset="100%" stop-color="#9b7cff"/></linearGradient>
              <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter>
              <filter id="portalGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="blur"/><feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.36 0 0 0 0 0.9 0 0 0 0 0.86 0 0 0 .75 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>

            <g id="roomA" data-room="A">
              <rect width="600" height="600" rx="26" fill="url(#bgA)"/>
              <g opacity=".18" fill="#d7f7f1"><circle cx="55" cy="80" r="3"/><circle cx="520" cy="68" r="2"/><circle cx="548" cy="235" r="4"/><circle cx="82" cy="300" r="2"/><circle cx="510" cy="482" r="2.5"/><circle cx="282" cy="172" r="3"/><circle cx="318" cy="542" r="2"/></g>
            </g>

            <g id="roomB" data-room="B" style="display:none">
              <rect width="600" height="600" rx="26" fill="url(#bgB)"/>
            </g>
              </svg>

              <div id="pixiLayer" class="pixi-layer" aria-hidden="true"></div>
            </div>
          </div>

          <div id="controlGear" class="gear control-gear" role="slider" tabindex="0" aria-label="World rotation control" aria-valuemin="-180" aria-valuemax="180" aria-valuenow="0">
            <svg class="gear-body" viewBox="0 0 600 600" aria-hidden="true">
              <path id="controlGearShape" class="gear-shape control-gear-shape"></path>
              <circle class="control-ring" cx="300" cy="300" r="226"></circle>
              <circle class="control-hub" cx="300" cy="300" r="58"></circle>
              <g class="control-spokes">
                <rect x="286" y="92" width="28" height="416" rx="14"></rect>
                <rect x="286" y="92" width="28" height="416" rx="14" transform="rotate(60 300 300)"></rect>
                <rect x="286" y="92" width="28" height="416" rx="14" transform="rotate(120 300 300)"></rect>
              </g>
              <circle class="control-grip" cx="300" cy="112" r="28"></circle>
            </svg>
          </div>
        </div>

      </div>
      <p class="status" id="status" aria-live="polite">Turn the lower gear to guide the ball.</p>
    </section>
  </main>

  <script src="./build-info.js?v=20260827132644"></script>
  <script src="./levels.generated.js?v=20260901-boundary-arcs"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js?rw=20260827132644"></script>
  <script src="./settings.js?v=20260827132644"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js?rw=20260827132644"></script>
  <script src="./geometry.js?v=20260901-boundary-arcs"></script>
  <script src="./app.js?v=20260901-boundary-arcs"></script>
</body>
</html>
