<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <title>Rotate World</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="game-card" aria-label="Rotate World prototype">
      <header class="hud">
        <div>
          <p class="eyebrow">ROTATE WORLD · <span id="levelLabel">ROOM A</span> · <span id="buildCommit">__BUILD_COMMIT__</span></p>
          <h1>Find the way</h1>
        </div>
        <button id="resetBtn" class="reset-btn" type="button">Reset</button>
      </header>

      <div id="game" class="game" aria-label="Game area. Rotate with two fingers.">
        <div id="worldStack" class="world-stack">
          <svg id="levelSvg" class="level" viewBox="0 0 600 600" role="img" aria-label="Connected puzzle rooms">
            <defs>
              <linearGradient id="bgA" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#14213d"/><stop offset="100%" stop-color="#172033"/></linearGradient>
              <linearGradient id="bgB" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#18352f"/><stop offset="100%" stop-color="#11231f"/></linearGradient>
              <linearGradient id="platformGradient" x1="0" x2="1"><stop offset="0%" stop-color="#9fd3c7"/><stop offset="100%" stop-color="#65b9ad"/></linearGradient>
              <linearGradient id="platformWarm" x1="0" x2="1"><stop offset="0%" stop-color="#f4c27a"/><stop offset="100%" stop-color="#df8f55"/></linearGradient>
              <linearGradient id="tubeGradient" x1="0" x2="1"><stop offset="0%" stop-color="#70d6c8"/><stop offset="50%" stop-color="#b7f0e8"/><stop offset="100%" stop-color="#4fa99e"/></linearGradient>
              <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter>
            </defs>

            <g id="roomA" data-room="A">
              <rect width="600" height="600" rx="26" fill="url(#bgA)"/>
              <g opacity=".18" fill="#d7f7f1"><circle cx="55" cy="80" r="3"/><circle cx="520" cy="68" r="2"/><circle cx="548" cy="235" r="4"/><circle cx="82" cy="300" r="2"/><circle cx="510" cy="482" r="2.5"/></g>
              <g filter="url(#softShadow)">
                <rect data-room-collider="A" x="54" y="505" width="205" height="20" rx="10" fill="url(#platformGradient)"/>
                <rect data-room-collider="A" x="344" y="475" width="178" height="20" rx="10" fill="url(#platformWarm)" transform="rotate(-12 433 485)"/>
                <rect data-room-collider="A" x="180" y="405" width="170" height="18" rx="9" fill="url(#platformGradient)" transform="rotate(13 265 414)"/>
                <rect data-room-collider="A" x="390" y="338" width="145" height="18" rx="9" fill="url(#platformGradient)"/>
                <rect data-room-collider="A" x="65" y="315" width="155" height="20" rx="10" fill="url(#platformWarm)" transform="rotate(-10 142 325)"/>
                <rect data-room-collider="A" x="260" y="260" width="145" height="18" rx="9" fill="url(#platformGradient)" transform="rotate(14 332 269)"/>
                <rect data-room-collider="A" x="82" y="205" width="158" height="20" rx="10" fill="url(#platformGradient)"/>
              </g>
              <g id="tubeA" transform="translate(455 92)">
                <rect x="-32" y="-70" width="64" height="92" rx="9" fill="url(#tubeGradient)" stroke="#d9fff8" stroke-width="4"/>
                <rect x="-43" y="12" width="86" height="24" rx="8" fill="#70d6c8" stroke="#d9fff8" stroke-width="4"/>
                <rect x="-30" y="29" width="60" height="17" fill="#091715" opacity=".85"/>
              </g>
            </g>

            <g id="roomB" data-room="B" style="display:none">
              <rect width="600" height="600" rx="26" fill="url(#bgB)"/>
            </g>
          </svg>

          <div id="pixiLayer" class="pixi-layer" aria-hidden="true"></div>
        </div>

        <div class="gesture-hint">↻ Rotate with two fingers</div>
      </div>
      <p class="status" id="status" aria-live="polite">Align test: ball + room + collisions.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
