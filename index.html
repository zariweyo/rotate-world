<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <title>Rotate World</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="game-card" aria-label="Rotate World prototype">
      <header class="hud">
        <div>
          <p class="eyebrow">ROTATE WORLD · <span id="levelLabel">LEVEL 1</span></p>
          <h1>Guide the orb</h1>
        </div>
        <button id="resetBtn" class="reset-btn" type="button">Reset</button>
      </header>

      <div id="game" class="game" aria-label="Game area. Rotate with two fingers.">
        <svg id="levelSvg" class="level" viewBox="0 0 600 600" role="img" aria-label="A square mechanical obstacle world">
          <defs>
            <linearGradient id="bgGradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#14213d"/><stop offset="55%" stop-color="#243d5a"/><stop offset="100%" stop-color="#172033"/></linearGradient>
            <linearGradient id="platformGradient" x1="0" x2="1"><stop offset="0%" stop-color="#9fd3c7"/><stop offset="100%" stop-color="#65b9ad"/></linearGradient>
            <linearGradient id="platformWarm" x1="0" x2="1"><stop offset="0%" stop-color="#f4c27a"/><stop offset="100%" stop-color="#df8f55"/></linearGradient>
            <linearGradient id="doorGradient" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff0a6"/><stop offset="100%" stop-color="#d49a35"/></linearGradient>
            <radialGradient id="doorGlow"><stop offset="0%" stop-color="#ffe9a3" stop-opacity=".9"/><stop offset="55%" stop-color="#ffd166" stop-opacity=".28"/><stop offset="100%" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
            <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter>
          </defs>
          <rect width="600" height="600" rx="26" fill="url(#bgGradient)"/>
          <g opacity=".2" fill="#d7f7f1"><circle cx="55" cy="80" r="3"/><circle cx="520" cy="68" r="2"/><circle cx="548" cy="235" r="4"/><circle cx="82" cy="300" r="2"/><circle cx="320" cy="278" r="3"/><circle cx="510" cy="482" r="2.5"/><circle cx="75" cy="530" r="3.5"/></g>
          <g id="world">
            <g opacity=".16" stroke="#dff7f2" stroke-width="1" fill="none"><path d="M45 135 C150 75 220 110 300 145 S465 190 555 125"/><path d="M35 410 C125 350 230 405 305 440 S470 475 565 420"/></g>
            <g filter="url(#softShadow)">
              <rect data-collider="rect" x="54" y="505" width="205" height="20" rx="10" fill="url(#platformGradient)"/>
              <rect data-collider="rect" x="344" y="475" width="178" height="20" rx="10" fill="url(#platformWarm)" transform="rotate(-12 433 485)"/>
              <rect data-collider="rect" x="180" y="405" width="170" height="18" rx="9" fill="url(#platformGradient)" transform="rotate(13 265 414)"/>
              <rect data-collider="rect" x="390" y="338" width="145" height="18" rx="9" fill="url(#platformGradient)"/>
              <rect data-collider="rect" x="65" y="315" width="155" height="20" rx="10" fill="url(#platformWarm)" transform="rotate(-10 142 325)"/>
              <rect data-collider="rect" x="260" y="260" width="145" height="18" rx="9" fill="url(#platformGradient)" transform="rotate(14 332 269)"/>
              <rect data-collider="rect" x="82" y="205" width="158" height="20" rx="10" fill="url(#platformGradient)"/>
              <rect data-collider="rect" x="375" y="170" width="150" height="18" rx="9" fill="url(#platformWarm)" transform="rotate(-13 450 179)"/>
              <rect data-collider="rect" x="205" y="105" width="155" height="20" rx="10" fill="url(#platformGradient)" transform="rotate(9 282 115)"/>
            </g>
            <g aria-hidden="true" fill="#ef476f" opacity=".85"><path d="M260 485 l13 -20 l13 20z"/><path d="M285 485 l13 -20 l13 20z"/><path d="M350 390 l12 -19 l12 19z"/></g>

            <g id="exitDoor" transform="translate(105 105)">
              <circle r="48" fill="url(#doorGlow)"/>
              <path d="M-22 24V-8C-22-27-11-38 0-38S22-27 22-8V24Z" fill="url(#doorGradient)" stroke="#fff0b8" stroke-width="4"/>
              <path d="M-13 24V-6C-13-18-7-26 0-26S13-18 13-6V24Z" fill="#172033" opacity=".92"/>
              <circle cx="12" cy="2" r="3" fill="#fff6cc"/>
              <path d="M-30 27H30" stroke="#f4c27a" stroke-width="6" stroke-linecap="round"/>
            </g>

            <g opacity=".24" fill="#dff7f2"><circle cx="55" cy="555" r="10"/><circle cx="545" cy="545" r="7"/><circle cx="530" cy="275" r="8"/><circle cx="58" cy="170" r="6"/></g>
          </g>
        </svg>
        <div id="pixiLayer" class="pixi-layer" aria-hidden="true"></div>
        <div class="gesture-hint">↻ Rotate with two fingers</div>
      </div>
      <p class="status" id="status" aria-live="polite">Reach the door.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
